<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Song Search with Lyrics</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
    }

    /* FIRST DIV */
    #search-area {
        height: 60vh;
        background: url("https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f")
            no-repeat center center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
    }

    .search-content {
        background: rgba(0,0,0,0.6);
        padding: 30px;
        border-radius: 10px;
        width: 90%;
        max-width: 500px;
    }

    .search-content h1 {
        margin-bottom: 20px;
    }

    .search-box {
        display: flex;
        gap: 10px;
    }

    .search-box input {
        flex: 1;
        padding: 12px;
        font-size: 16px;
        border-radius: 5px;
        border: none;
        outline: none;
    }

    .search-box button {
        width: 50px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        background-color: pink;
    }

    /* SECOND DIV */
    #results-area {
        padding: 20px;
        max-width: 800px;
        margin: auto;
    }

    .song {
        background: white;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .song-info {
        font-size: 16px;
    }

    .song button {
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background: #2196f3;
        color: white;
    }

    .lyrics {
        margin-top: 10px;
        background: #f9f9f9;
        padding: 10px;
        border-radius: 5px;
        display: none;
        white-space: pre-line;
    }
</style>
</head>

<body>

<!-- FIRST DIV -->
<div id="search-area">
    <div class="search-content">
        <h1>Lyrics Search</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter song name...">
            <button onclick="searchSongs()">Search</button>
        </div>
    </div>
</div>

<!-- SECOND DIV -->
<div id="results-area"></div>

<script src="script.js"></script>

</body>
</html>
